[listener]
# The relay server the PC talks to. Reuses your Amos deployment by default.
server_url = https://api.amos.fyi

# Paste the API key the web panel showed when you clicked "Add device".
# Keep this secret — anyone with it can power this PC off.
api_key = PASTE_YOUR_DEVICE_API_KEY_HERE

# A friendly name for this PC (just for your reference in the panel).
device = Home PC

# Device type shown in the panel. "auto" detects desktop / laptop / server;
# or force it with: pc, desktop, laptop, server.
kind = auto

# How often to check the server for commands, in seconds.
poll_interval = 5

# Set to true while testing: commands are logged but NOT executed.
dry_run = false
