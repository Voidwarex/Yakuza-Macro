# The website at amos.fyi (and www.amos.fyi, which redirects to it).
#
# Cloudflare sits in front (DNS records proxied, SSL/TLS mode
# "Full (strict)") and connects here with the same Cloudflare Origin
# Certificate as api.amos.fyi. Files are served from /var/www/amos.
#
# Copy to /etc/nginx/conf.d/amos-site.conf, then:
#   nginx -t && systemctl reload nginx

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.amos.fyi;

    ssl_certificate     /etc/ssl/amos/origin.pem;
    ssl_certificate_key /etc/ssl/amos/origin.key;

    return 301 https://amos.fyi$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name amos.fyi;

    ssl_certificate     /etc/ssl/amos/origin.pem;
    ssl_certificate_key /etc/ssl/amos/origin.key;

    root  /var/www/amos;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The app download. Missing files are a 404 (not the homepage),
    # the browser always saves the file, and nothing caches it, so a
    # new build uploaded under the same name is served straight away.
    location /download/ {
        try_files $uri =404;
        add_header Content-Disposition attachment always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Let browsers and Cloudflare cache the page briefly so updates
    # still show up within a few minutes.
    location = /index.html {
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
