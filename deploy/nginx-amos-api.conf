# HTTPS for the license server at api.amos.fyi.
#
# Cloudflare sits in front (DNS record proxied, SSL/TLS mode
# "Full (strict)") and connects here with a Cloudflare Origin
# Certificate. nginx passes requests to license_server.py on
# 127.0.0.1:8000.
#
# Copy to /etc/nginx/conf.d/amos-api.conf, then:
#   nginx -t && systemctl reload nginx

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name api.amos.fyi;

    ssl_certificate     /etc/ssl/amos/origin.pem;
    ssl_certificate_key /etc/ssl/amos/origin.key;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 15s;
    }
}
