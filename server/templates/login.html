<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Remote Power — Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <div class="login-wrap">
        <form class="login-card" method="post">
            <div class="logo">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
                    <line x1="12" y1="2" x2="12" y2="12" />
                </svg>
                Remote Power
            </div>
            <p class="subtitle">Sign in to control your devices</p>

            {% if error %}<div class="error">{{ error }}</div>{% endif %}

            <input type="email" name="email" placeholder="Email" autofocus
                   autocomplete="email" required />
            <input type="password" name="password" placeholder="Password"
                   autocomplete="current-password" required />
            <button type="submit" class="btn-green full">Sign in</button>
            <p class="alt-link">No account? <a href="{{ url_for('register') }}">Create one</a></p>
        </form>
    </div>
</body>
</html>
