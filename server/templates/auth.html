<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Remote Power — {{ 'Create account' if active == 'register' else 'Sign in' }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <div class="auth-wrap">
        <div class="auth-stage">
            <div class="auth-flip {{ 'flipped' if active == 'register' else '' }}" id="flip">

                <!-- Sign in -->
                <form class="login-card auth-face auth-front" method="post"
                      action="{{ url_for('login') }}">
                    <div class="logo">
                        <svg class="brand-mark" width="26" height="26" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
                            <line x1="12" y1="2" x2="12" y2="12" />
                        </svg>
                        Remote Power
                    </div>
                    <p class="subtitle">Sign in to control your devices</p>

                    {% if active == 'login' and error %}<div class="error">{{ error }}</div>{% endif %}

                    <input type="email" name="email" placeholder="Email" autocomplete="email" required />
                    <input type="password" name="password" placeholder="Password"
                           autocomplete="current-password" required />
                    <button type="submit" class="btn-green full btn-load">
                        <span class="btn-label">Sign in</span>
                        <span class="btn-spin" aria-hidden="true"></span>
                    </button>
                    <p class="alt-link">No account?
                        <a href="{{ url_for('register') }}" data-flip="register">Create one</a></p>
                </form>

                <!-- Create account -->
                <form class="login-card auth-face auth-back" method="post"
                      action="{{ url_for('register') }}">
                    <div class="logo">
                        <svg class="brand-mark" width="26" height="26" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
                            <line x1="12" y1="2" x2="12" y2="12" />
                        </svg>
                        Remote Power
                    </div>
                    <p class="subtitle">Create your free account — 3 devices included</p>

                    {% if active == 'register' and error %}<div class="error">{{ error }}</div>{% endif %}

                    <input type="email" name="email" placeholder="Email" autocomplete="email" required />
                    <input type="password" name="password" placeholder="Password (min 8 characters)"
                           autocomplete="new-password" required minlength="8" />
                    <button type="submit" class="btn-green full btn-load">
                        <span class="btn-label">Create account</span>
                        <span class="btn-spin" aria-hidden="true"></span>
                    </button>
                    <p class="alt-link">Already have one?
                        <a href="{{ url_for('login') }}" data-flip="login">Sign in</a></p>
                </form>

            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
